name: Build PLASMA Sonic World

on:
  push:
    branches: [main, master]
    paths:
      - 'PLASMA_Source.zip'
      - '.github/workflows/build-plasma.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
          cache-provider: basic

      - name: Extract PLASMA source
        run: |
          mkdir -p build-input
          unzip -q PLASMA_Source.zip -d build-input
          PROJECT_DIR="$(find build-input -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -f "$PROJECT_DIR/build.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate JSON resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("${{ github.workspace }}") / "${{ env.PROJECT_DIR }}" / "src/main/resources"
          files = list(root.rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Valid JSON files: {len(files)}")
          PY

      - name: Build mod JAR
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Sonic-World-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

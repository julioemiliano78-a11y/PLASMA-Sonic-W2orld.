name: Build PLASMA Sonic World

on:
  push:
    branches: [main, master]
    paths:
      - 'PLASMA_Source.zip'
      - '.github/workflows/build-plasma.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Extract first: setup-gradle scans the workspace for Gradle build files.
      - name: Extract PLASMA source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-input
          unzip -q PLASMA_Source.zip -d build-input
          PROJECT_DIR="$(find build-input -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "Could not find build.gradle inside PLASMA_Source.zip"
            find build-input -maxdepth 3 -type f | head -80
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Must run after extraction so this action can discover build.gradle.
      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.8'
          cache-provider: basic

      - name: Validate JSON resources
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          root = project / "src/main/resources"
          if not root.is_dir():
              raise SystemExit(f"Missing resources directory: {root}")
          files = list(root.rglob("*.json"))
          for path in files:
              try:
                  json.loads(path.read_text(encoding="utf-8"))
              except Exception as exc:
                  raise SystemExit(f"Invalid JSON: {path}: {exc}")
          print(f"Valid JSON files: {len(files)}")
          PY

      - name: Build mod JAR
        shell: bash
        run: gradle -p "$PROJECT_DIR" build --no-daemon --stacktrace

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: PLASMA-Sonic-World-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
